<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JS Event Playground</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🎈 JavaScript Event Playground</h1>
  </header>

  <!-- Button Click -->
  <section>
    <button id="magicBtn">Click Me!</button>
  </section>

  <!-- Hover Effect -->
  <section>
    <div id="hoverBox">Hover over me!</div>
  </section>

  <!-- Keypress Detection -->
  <section>
    <input type="text" id="keyInput" placeholder="Type something..." />
    <p id="keyDisplay"></p>
  </section>

  <!-- Secret Double Click -->
  <section>
    <div id="secretZone">Double-click or hold me 😉</div>
    <p id="secretMessage"></p>
  </section>

  <!-- Interactive Button -->
  <section>
    <button id="colorChangeBtn">Change my color</button>
  </section>

  

  <!-- Tabs -->
  <section class="tabs">
    <button class="tabBtn" data-tab="1">Tab 1</button>
    <button class="tabBtn" data-tab="2">Tab 2</button>
    <div class="tabContent" id="tab1">Content for Tab 1</div>
    <div class="tabContent" id="tab2">Content for Tab 2</div>
  </section>

  <!-- Form Validation -->
  <section>
    <form id="signupForm">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Submit</button>
      <p id="formFeedback"></p>
    </form>
  </section>

  <script src="script.js"></script>
</body>
</html>
